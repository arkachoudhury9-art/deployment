<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #fff;
        --text: #1a1a1a;
        --muted: #5c6370;
        --border: #d8dce3;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #b42318;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --card: #1c1f26;
          --text: #f3f4f6;
          --muted: #9aa3b2;
          --border: #2d3340;
          --accent: #3b82f6;
          --accent-hover: #60a5fa;
          --error: #f97066;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
      }

      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 120px auto;
        gap: 12px;
        align-items: end;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status.error {
        color: var(--error);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
      }

      th {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .empty {
        color: var(--muted);
        margin: 0;
      }

      @media (max-width: 600px) {
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Users</h1>
      <p class="lead">Add a user and view everyone stored in the database.</p>

      <section>
        <h2>Add users Test</h2>
        <form id="user-form">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required autocomplete="name" />
          </div>
          <div>
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="0" required />
          </div>
          <button type="submit">Add</button>
        </form>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section>
        <h2>All users</h2>
        <div id="users"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("user-form");
      const statusEl = document.getElementById("status");
      const usersEl = document.getElementById("users");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function renderUsers(users) {
        if (!users.length) {
          usersEl.innerHTML = '<p class="empty">No users yet.</p>';
          return;
        }

        usersEl.innerHTML = `
          <table>
            <thead>
              <tr><th>ID</th><th>Name</th><th>Age</th></tr>
            </thead>
            <tbody>
              ${users
                .map(
                  (user) =>
                    `<tr><td>${user.id}</td><td>${escapeHtml(user.name)}</td><td>${user.age}</td></tr>`
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function loadUsers() {
        const response = await fetch("/users");
        if (!response.ok) {
          throw new Error("Could not load users");
        }
        renderUsers(await response.json());
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submit = form.querySelector("button");
        const payload = {
          name: form.name.value.trim(),
          age: Number(form.age.value),
        };

        submit.disabled = true;
        setStatus("Saving...");

        try {
          const response = await fetch("/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const detail = await response.json().catch(() => null);
            throw new Error(detail?.detail?.[0]?.msg || "Could not create user");
          }

          form.reset();
          setStatus("User added.");
          await loadUsers();
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submit.disabled = false;
        }
      });

      loadUsers().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
